@if (!isCalendarPage()) {
	<button
	type="button"
	class="fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] right-[calc(1rem+env(safe-area-inset-right))] z-30 inline-flex h-12 cursor-pointer items-center gap-2 rounded-2xl border border-fuchsia-400/30 bg-[#211733]/95 px-3 text-sm font-semibold text-white shadow-[0_12px_32px_rgba(0,0,0,0.38)] backdrop-blur transition hover:bg-violet-500/25 focus:outline-none focus:ring-2 focus:ring-fuchsia-300/70 sm:h-11 sm:px-4"
	attr.aria-expanded="{{ isOpen() }}"
	aria-controls="campaign-clock-panel"
	aria-label="Abrir relógio da campanha"
	title="Relógio da campanha"
	(click)="open()"
	>
	<svg
		viewBox="0 0 24 24"
		class="h-5 w-5 shrink-0 text-fuchsia-200"
		fill="none"
		stroke="currentColor"
		stroke-width="1.8"
		stroke-linecap="round"
		stroke-linejoin="round"
		aria-hidden="true"
	>
		<circle cx="12" cy="12" r="8"></circle>
		<path d="M12 8v4l3 2"></path>
	</svg>
	<span class="hidden tabular-nums sm:inline">Dia {{ current().day }} · {{ timeLabel() }}</span>
	<span class="tabular-nums sm:hidden">{{ timeLabel() }}</span>
</button>

	@if (isOpen()) {
	<div
		class="fixed inset-0 z-50 flex items-end justify-center bg-black/65 p-3 backdrop-blur-sm sm:items-center sm:p-4"
		(click)="close()"
	>
		<section
			id="campaign-clock-panel"
			role="dialog"
			aria-modal="true"
			aria-labelledby="campaign-clock-title"
			class="w-full max-w-md rounded-[28px] border border-white/10 bg-[#161b2a] p-4 shadow-2xl sm:p-5"
			(click)="$event.stopPropagation()"
		>
			<div class="flex items-start justify-between gap-3">
				<div>
					<div class="text-xs uppercase tracking-[0.2em] text-white/45">Tempo da campanha</div>
					<h2 id="campaign-clock-title" class="mt-1 text-xl font-semibold">
						Dia {{ current().day }} de {{ seasonLabel() }}
					</h2>
					<div class="mt-1 text-sm text-white/65">
						{{ weekdayLabel() }} · Ano {{ current().year }}
					</div>
				</div>
				<button
					type="button"
					class="inline-flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-2xl border border-white/10 bg-white/5 text-lg hover:bg-white/10"
					aria-label="Fechar relógio da campanha"
					(click)="close()"
				>
					x
				</button>
			</div>

			<div class="mt-4 flex items-center justify-between rounded-2xl border border-fuchsia-400/20 bg-violet-500/[0.1] px-4 py-3">
				<span class="text-sm text-white/70">Hora atual</span>
				<span class="text-3xl font-semibold tabular-nums text-white">{{ timeLabel() }}</span>
			</div>

			@if (eventLabel(); as event) {
				<div class="mt-3 text-sm text-amber-100/85">Hoje: {{ event }}</div>
			}

			<div class="mt-4 grid grid-cols-2 gap-2">
				<button type="button" class="h-11 rounded-2xl border border-white/10 bg-white/5 text-sm hover:bg-white/10" (click)="advanceMinutes(-10)">-10 min</button>
				<button type="button" class="h-11 rounded-2xl border border-white/10 bg-white/5 text-sm hover:bg-white/10" (click)="advanceMinutes(10)">+10 min</button>
				<button type="button" class="h-11 rounded-2xl border border-white/10 bg-white/5 text-sm hover:bg-white/10" (click)="advanceHours(-1)">-1 hora</button>
				<button type="button" class="h-11 rounded-2xl border border-white/10 bg-white/5 text-sm hover:bg-white/10" (click)="advanceHours(1)">+1 hora</button>
				<button type="button" class="h-11 rounded-2xl border border-white/10 bg-white/5 text-sm hover:bg-white/10" (click)="advanceDays(-1)">-1 dia</button>
				<button type="button" class="h-11 rounded-2xl border border-fuchsia-400/30 bg-violet-500/15 text-sm font-semibold hover:bg-violet-500/25" (click)="advanceDays(1)">+1 dia</button>
			</div>

			<form class="mt-4 border-t border-white/10 pt-4" (ngSubmit)="applyDirectTime()">
				<div class="grid grid-cols-[1fr_1fr_1fr_auto] items-end gap-2">
					<label class="min-w-0 text-xs text-white/65">
						<span>Dia</span>
						<input type="number" min="1" max="30" step="1" class="mt-1 h-10 w-full rounded-xl border border-white/10 bg-black/20 px-2 text-center text-sm tabular-nums" [(ngModel)]="editDay" name="day" />
					</label>
					<label class="min-w-0 text-xs text-white/65">
						<span>Hora</span>
						<input type="number" min="0" max="23" step="1" class="mt-1 h-10 w-full rounded-xl border border-white/10 bg-black/20 px-2 text-center text-sm tabular-nums" [(ngModel)]="editHour" name="hour" />
					</label>
					<label class="min-w-0 text-xs text-white/65">
						<span>Min.</span>
						<input type="number" min="0" max="59" step="1" class="mt-1 h-10 w-full rounded-xl border border-white/10 bg-black/20 px-2 text-center text-sm tabular-nums" [(ngModel)]="editMinute" name="minute" />
					</label>
					<button type="submit" class="h-10 rounded-xl border border-fuchsia-400/30 bg-violet-500/15 px-3 text-sm font-semibold hover:bg-violet-500/25">Aplicar</button>
				</div>
			</form>

			<button type="button" class="mt-4 h-11 w-full rounded-2xl border border-white/10 bg-white/5 text-sm font-semibold hover:bg-white/10" (click)="openCalendar()">Abrir calendário</button>
		</section>
	</div>
}
}
