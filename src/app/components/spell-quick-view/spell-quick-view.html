@if (open && resolvedSpell(); as spell) {
	<div
		class="fixed inset-0 z-[var(--z-app-modal)] flex items-center justify-center bg-black/80 p-3 backdrop-blur-sm sm:p-6"
		(click)="close()"
	>
		<section
			role="dialog"
			aria-modal="true"
			aria-labelledby="spell-quick-view-title"
			[appDialogFocus]="true"
			(appDialogEscape)="close()"
			class="app-dialog max-h-[calc(100vh-1.5rem)] w-full max-w-3xl overflow-y-auto p-4 sm:max-h-[calc(100vh-3rem)] sm:p-5"
			(click)="$event.stopPropagation()"
		>
			<div class="flex items-start justify-between gap-4 border-b border-violet-300/20 pb-4">
				<div class="min-w-0">
					<div class="app-eyebrow text-violet-200/75">Consulta rápida</div>
					<h2 id="spell-quick-view-title" class="mt-1 text-2xl font-semibold tracking-tight text-app-text">
						{{ spell.name }}
					</h2>
					<p class="mt-1 text-sm text-app-muted">{{ levelLabel(spell.level) }} · {{ spell.school }}</p>
				</div>
				<div class="flex shrink-0 items-center gap-2">
					<span class="app-status border-violet-300/25 bg-violet-500/10 text-violet-100">{{ spell.source }}</span>
					<button
						type="button"
						class="app-button app-modal-close h-10 w-10 p-0"
						data-dialog-initial-focus
						(click)="close()"
						aria-label="Fechar consulta rápida de magia"
					>
						<svg lucideX [size]="22" [strokeWidth]="2.5" aria-hidden="true"></svg>
					</button>
				</div>
			</div>

			<div class="mt-4"><app-spell-reference-content [spell]="spell" /></div>
			<div class="mt-6 flex justify-end border-t border-app-divider pt-4">
				<button type="button" class="app-button app-button-primary" (click)="openInCompendium()">
					<svg lucideExternalLink [size]="16" [strokeWidth]="2.25" aria-hidden="true"></svg>
					Abrir no compêndio
				</button>
			</div>
		</section>
	</div>
}
