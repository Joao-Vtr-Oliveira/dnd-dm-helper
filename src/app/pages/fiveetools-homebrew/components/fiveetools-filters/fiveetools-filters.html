<section class="app-panel five-filters p-4 sm:p-5">
	<div class="flex flex-col gap-4 xl:flex-row xl:items-end"><label class="block min-w-0 flex-1"><span class="app-eyebrow">Buscar biblioteca</span><input class="app-field mt-2 w-full px-3" [value]="search" (input)="searchChange.emit($any($event.target).value || '')" placeholder="Nome, source, grupo, tipo, spell ou trait..." /></label><div class="flex flex-wrap gap-1 rounded-app-control border border-app-border bg-app-inset p-1">@for (tab of tabs; track tab.key) { <button type="button" class="five-filter-tab" [class.five-filter-tab-active]="collectionTab === tab.key" (click)="collectionTabChange.emit(tab.key)"><span>{{ tab.label }}</span><span>{{ countForTab(tab.key) }}</span></button> }</div></div>
	<div class="mt-4 flex flex-col gap-3 border-t border-app-divider pt-4 sm:flex-row sm:items-center sm:justify-between"><div class="app-action-group"><button type="button" class="app-button app-button-secondary" (click)="advancedToggle.emit()">{{ advancedOpen ? 'Ocultar filtros' : 'Filtros avançados' }}</button><button type="button" class="app-button app-button-ghost" (click)="clearFilters.emit()" [disabled]="!search && sourceFilter === 'all' && groupFilter === 'all' && creatureTypeFilter === 'all' && crFilter === 'all'">Limpar filtros</button></div><div class="text-sm text-app-muted"><strong class="text-app-text">{{ resultCount }}</strong> resultados</div></div>
	@if (advancedOpen) { <div class="mt-4 grid gap-3 border-t border-app-divider pt-4 md:grid-cols-2 xl:grid-cols-4"><label class="five-filter-field"><span>Source</span><select [ngModel]="sourceFilter" (ngModelChange)="sourceFilterChange.emit($event)"><option value="all">Todos</option><option *ngFor="let source of summary.availableSources" [value]="source">{{ source }}</option></select></label><label class="five-filter-field"><span>Grupo / tag</span><select [ngModel]="groupFilter" (ngModelChange)="groupFilterChange.emit($event)"><option value="all">Todos</option><option *ngFor="let group of summary.availableGroups" [value]="group">{{ group }}</option></select></label><label class="five-filter-field"><span>Tipo de criatura</span><select [ngModel]="creatureTypeFilter" (ngModelChange)="creatureTypeFilterChange.emit($event)"><option value="all">Todos</option><option *ngFor="let type of summary.availableCreatureTypes" [value]="type">{{ type }}</option></select></label><label class="five-filter-field"><span>CR</span><select [ngModel]="crFilter" (ngModelChange)="crFilterChange.emit($event)"><option value="all">Todos</option><option value="0-1">0-1</option><option value="2-4">2-4</option><option value="5-10">5-10</option><option value="11+">11+</option></select></label></div> }
</section>
