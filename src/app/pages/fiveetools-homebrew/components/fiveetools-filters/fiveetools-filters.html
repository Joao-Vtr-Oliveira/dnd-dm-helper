<section class="app-panel five-filters p-4 sm:p-5">
	<div class="flex flex-col gap-4 xl:flex-row xl:items-end">
		<label class="block min-w-0 flex-1"
			><span class="app-eyebrow">Buscar biblioteca</span
			><input
				class="app-field mt-2 w-full px-3"
				[value]="search"
				(input)="searchChange.emit($any($event.target).value || '')"
				placeholder="Nome, source, grupo, tipo, spell ou trait..."
		/></label>
		<div class="flex flex-wrap gap-1 rounded-app-control border border-app-border bg-app-inset p-1">
			@for (tab of tabs; track tab.key) {
				<button
					type="button"
					class="five-filter-tab"
					[class.five-filter-tab-active]="collectionTab === tab.key"
					(click)="collectionTabChange.emit(tab.key)"
				>
					<span>{{ tab.label }}</span
					><span>{{ countForTab(tab.key) }}</span>
				</button>
			}
		</div>
	</div>
	<div
		class="mt-4 flex flex-col gap-3 border-t border-app-divider pt-4 sm:flex-row sm:items-center sm:justify-between"
	>
		<div class="app-action-group">
			<button type="button" class="app-button app-button-secondary" (click)="advancedToggle.emit()">
				{{ advancedOpen ? 'Ocultar filtros' : 'Filtros avançados' }}</button
			><button
				type="button"
				class="app-button app-button-ghost"
				(click)="clearFilters.emit()"
				[disabled]="
					!search &&
					sourceFilter === 'all' &&
					groupFilter === 'all' &&
					creatureTypeFilter === 'all' &&
					crFilter === 'all'
				"
			>
				Limpar filtros
			</button>
		</div>
		<div class="text-sm text-app-muted">
			<strong class="text-app-text">{{ resultCount }}</strong> resultados
		</div>
	</div>
	@if (advancedOpen) {
		<div class="mt-4 grid gap-3 border-t border-app-divider pt-4 md:grid-cols-2 xl:grid-cols-4">
			<app-select
				label="Source"
				[options]="summary.availableSources"
				[value]="sourceFilter"
				emptyValue="all"
				emptyLabel="Todos"
				[searchable]="true"
				(valueChange)="sourceFilterChange.emit($event)"
			/><app-select
				label="Grupo / tag"
				[options]="summary.availableGroups"
				[value]="groupFilter"
				emptyValue="all"
				emptyLabel="Todos"
				(valueChange)="groupFilterChange.emit($event)"
			/><app-select
				label="Tipo de criatura"
				[options]="summary.availableCreatureTypes"
				[value]="creatureTypeFilter"
				emptyValue="all"
				emptyLabel="Todos"
				(valueChange)="creatureTypeFilterChange.emit($event)"
			/><app-select
				label="CR"
				[options]="['0-1', '2-4', '5-10', '11+']"
				[value]="crFilter"
				emptyValue="all"
				emptyLabel="Todos"
				(valueChange)="crFilterChange.emit($any($event))"
			/>
		</div>
	}
</section>
